name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies in Lambda-compatible environment
        run: |
          mkdir -p build
          # Use Docker with Amazon Linux 2 (same as Lambda runtime) to install dependencies
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            --entrypoint /bin/bash \
            public.ecr.aws/lambda/python:3.10 \
            -c "pip install --upgrade pip && pip install --no-cache-dir --no-compile --only-binary=:all: -r requirements.txt -t build"

          # Copy Python files
          cp *.py build/

          # Remove unnecessary files to reduce package size
          cd build
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.pyo" -delete 2>/dev/null || true
          find . -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true

      - name: Create ZIP package
        run: |
          cd build
          zip -r9 ../app.zip .

      - name: Check package size
        run: |
          SIZE=$(du -h app.zip | cut -f1)
          SIZE_BYTES=$(stat -c%s app.zip)
          echo "Package size: $SIZE ($SIZE_BYTES bytes)"
          if [ $SIZE_BYTES -gt 52428800 ]; then
            echo "::warning::Package size exceeds 50MB. Consider using Lambda layers or S3."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME || 'ai_test' }}
        run: |
          echo "Deploying to Lambda function: $FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://app.zip

          echo "Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

          echo "Deployment completed successfully!"
